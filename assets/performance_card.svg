<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="perfBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1B0720"/>
      <stop offset="45%" stop-color="#0E0518"/>
      <stop offset="100%" stop-color="#040209"/>
    </linearGradient>

    <!-- PEA Purple & Gold Gradients -->
    <linearGradient id="purpleGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8C249E"/>
      <stop offset="100%" stop-color="#B23FD4"/>
    </linearGradient>
    <linearGradient id="goldGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE57F"/>
      <stop offset="100%" stop-color="#FDB913"/>
    </linearGradient>

    <!-- Rose & Crimson Gradients for Performance System -->
    <linearGradient id="roseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FB7185"/>
      <stop offset="50%" stop-color="#F43F5E"/>
      <stop offset="100%" stop-color="#BE123C"/>
    </linearGradient>

    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(35, 15, 38, 0.88)"/>
      <stop offset="100%" stop-color="rgba(16, 8, 22, 0.96)"/>
    </linearGradient>

    <linearGradient id="slideBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(28, 12, 38, 0.9)"/>
      <stop offset="100%" stop-color="rgba(12, 6, 20, 0.95)"/>
    </linearGradient>

    <linearGradient id="successGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <linearGradient id="pptxGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FB923C"/>
      <stop offset="100%" stop-color="#EA580C"/>
    </linearGradient>

    <!-- Glow Filters -->
    <filter id="roseGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="15" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Tech Grid Pattern -->
    <pattern id="gridPattern" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="rgba(244, 63, 94, 0.1)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#perfBgGrad)"/>
  <rect width="800" height="450" fill="url(#gridPattern)"/>

  <!-- Ambient Glowing Orbs -->
  <circle cx="650" cy="160" r="180" fill="#F43F5E" opacity="0.22" filter="blur(65px)"/>
  <circle cx="210" cy="220" r="160" fill="#741F84" opacity="0.25" filter="blur(55px)"/>
  <circle cx="450" cy="380" r="140" fill="#FDB913" opacity="0.12" filter="blur(50px)"/>

  <!-- Technical Circuit & Transmission Lines -->
  <g stroke="#F43F5E" stroke-width="1" opacity="0.22" stroke-dasharray="5 5">
    <line x1="50" y1="395" x2="750" y2="395"/>
    <line x1="90" y1="50" x2="90" y2="400"/>
    <line x1="710" y1="50" x2="710" y2="400"/>
    <circle cx="410" cy="225" r="185" stroke-width="0.8"/>
  </g>

  <!-- Left: Work Performance Dashboard Card Mockup -->
  <g transform="translate(65, 70)">
    <!-- Board Base Shadow & Card -->
    <rect x="0" y="0" width="345" height="305" rx="16" fill="url(#cardBg)" stroke="rgba(244, 63, 94, 0.42)" stroke-width="1.5" filter="drop-shadow(0 15px 30px rgba(0,0,0,0.65))"/>

    <!-- Header Bar inside board -->
    <rect x="1" y="1" width="343" height="50" rx="15" fill="rgba(244, 63, 94, 0.16)"/>
    <path d="M 1 51 L 344 51" stroke="rgba(244, 63, 94, 0.28)" stroke-width="1"/>

    <!-- Status Badge -->
    <rect x="16" y="14" width="138" height="23" rx="6" fill="#F43F5E" opacity="0.95"/>
    <text x="24" y="30" font-family="'Kanit', 'Prompt', sans-serif" font-size="11" font-weight="700" fill="#FFFFFF" letter-spacing="0.5">ผจส.กรย.(ก3) • รายงานผลงาน</text>

    <!-- Mini Approval Status Tag -->
    <rect x="236" y="14" width="94" height="23" rx="11.5" fill="rgba(16, 185, 129, 0.18)" stroke="#34D399" stroke-width="1"/>
    <circle cx="249" cy="25.5" r="3.5" fill="#10B981"/>
    <text x="258" y="29.5" font-family="'Prompt', sans-serif" font-size="10.5" font-weight="600" fill="#6EE7B7">อนุมัติแล้ว</text>

    <!-- Item 1: Daily Performance Report -->
    <g transform="translate(18, 66)">
      <rect x="0" y="0" width="309" height="62" rx="10" fill="rgba(255,255,255,0.03)" stroke="rgba(244, 63, 94, 0.25)" stroke-width="1"/>
      <circle cx="22" cy="24" r="12" fill="rgba(244, 63, 94, 0.2)"/>
      <text x="17" y="29" font-family="'Prompt', sans-serif" font-size="13">📝</text>
      <text x="42" y="22" font-family="'Prompt', sans-serif" font-size="12" font-weight="600" fill="#FCE7F3">บันทึกรายงานการปฏิบัติงานประจำวัน</text>
      <text x="42" y="38" font-family="'Prompt', sans-serif" font-size="9.5" fill="#FDA4AF">เขียนรายงาน แนบภาพหน้างาน และส่งตรวจ</text>
      <!-- Mini Progress -->
      <rect x="42" y="46" width="190" height="5" rx="2.5" fill="rgba(255,255,255,0.1)"/>
      <rect x="42" y="46" width="180" height="5" rx="2.5" fill="url(#roseGrad)"/>
      <rect x="245" y="16" width="52" height="20" rx="10" fill="#10B981"/>
      <text x="256" y="30" font-family="'Prompt', sans-serif" font-size="9.5" font-weight="600" fill="#FFFFFF">ส่งแล้ว</text>
    </g>

    <!-- Item 2: Task Assignment & Tracking -->
    <g transform="translate(18, 140)">
      <rect x="0" y="0" width="309" height="62" rx="10" fill="rgba(255,255,255,0.03)" stroke="rgba(253, 185, 19, 0.25)" stroke-width="1"/>
      <circle cx="22" cy="24" r="12" fill="rgba(253, 185, 19, 0.18)"/>
      <text x="16" y="29" font-family="'Prompt', sans-serif" font-size="13">🎯</text>
      <text x="42" y="22" font-family="'Prompt', sans-serif" font-size="12" font-weight="600" fill="#FEF3C7">มอบหมายภารกิจงาน (Task Assignment)</text>
      <text x="42" y="38" font-family="'Prompt', sans-serif" font-size="9.5" fill="#FDE68A">หัวหน้างานมอบหมาย &gt; ผู้ปฏิบัติงานอัปเดต</text>
      <!-- Mini Progress -->
      <rect x="42" y="46" width="190" height="5" rx="2.5" fill="rgba(255,255,255,0.1)"/>
      <rect x="42" y="46" width="155" height="5" rx="2.5" fill="url(#goldGlow)"/>
      <rect x="245" y="16" width="52" height="20" rx="10" fill="#D97706"/>
      <text x="252" y="30" font-family="'Prompt', sans-serif" font-size="9.5" font-weight="600" fill="#FFFFFF">ตรงเวลา</text>
    </g>

    <!-- Item 3: Quarterly Performance & Evaluation -->
    <g transform="translate(18, 214)">
      <rect x="0" y="0" width="309" height="74" rx="10" fill="rgba(255,255,255,0.03)" stroke="rgba(184, 53, 212, 0.28)" stroke-width="1"/>
      <circle cx="22" cy="25" r="12" fill="rgba(184, 53, 212, 0.22)"/>
      <text x="16" y="30" font-family="'Prompt', sans-serif" font-size="13">📊</text>
      <text x="42" y="22" font-family="'Prompt', sans-serif" font-size="12" font-weight="600" fill="#F3E8FF">ประเมินผลงาน &amp; สรุปรายไตรมาส</text>
      <text x="42" y="38" font-family="'Prompt', sans-serif" font-size="9.5" fill="#E9D5FF">Quarterly Performance &amp; Evaluation</text>
      <!-- Mini Metric Badges -->
      <g transform="translate(42, 47)">
        <rect x="0" y="0" width="75" height="18" rx="5" fill="rgba(184, 53, 212, 0.25)"/>
        <text x="8" y="13" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="600" fill="#F0ABFC">KPI: 98.5%</text>

        <rect x="83" y="0" width="80" height="18" rx="5" fill="rgba(16, 185, 129, 0.22)"/>
        <text x="91" y="13" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="600" fill="#6EE7B7">เกรด A+ ดีเยี่ยม</text>
      </g>
      <rect x="236" y="18" width="61" height="22" rx="11" fill="url(#purpleGlow)"/>
      <text x="246" y="33" font-family="'Prompt', sans-serif" font-size="10" font-weight="700" fill="#FFFFFF">100% ครบ</text>
    </g>
  </g>

  <!-- Right: PowerPoint / Slide Generator & Executive Report Showcase -->
  <g transform="translate(445, 80)">
    <!-- Base Container: Presentation Slide Mockup -->
    <rect x="0" y="0" width="295" height="285" rx="16" fill="url(#slideBg)" stroke="rgba(253, 185, 19, 0.38)" stroke-width="1.5" filter="drop-shadow(0 15px 30px rgba(0,0,0,0.65))"/>

    <!-- Slide Header -->
    <rect x="1" y="1" width="293" height="42" rx="15" fill="rgba(253, 185, 19, 0.14)"/>
    <path d="M 1 43 L 294 43" stroke="rgba(253, 185, 19, 0.25)" stroke-width="1"/>

    <!-- PPTX Generator Badge -->
    <rect x="14" y="11" width="108" height="21" rx="5" fill="url(#pptxGrad)"/>
    <text x="22" y="26" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="700" fill="#FFFFFF">📊 PPTX &amp; PDF</text>

    <!-- Cloud Sync Pill -->
    <rect x="180" y="11" width="100" height="21" rx="10.5" fill="rgba(62, 207, 142, 0.2)" stroke="#3ECF8E" stroke-width="1"/>
    <circle cx="192" cy="21.5" r="3.5" fill="#3ECF8E"/>
    <text x="201" y="25.5" font-family="'Prompt', sans-serif" font-size="9.5" font-weight="600" fill="#A7F3D0">Supabase Cloud</text>

    <!-- Presentation Slide Graphic Inside -->
    <g transform="translate(16, 56)">
      <!-- Slide Canvas Box -->
      <rect x="0" y="0" width="263" height="135" rx="10" fill="#0A0410" stroke="rgba(244, 63, 94, 0.3)" stroke-width="1"/>
      
      <!-- Slide Title & PEA Symbol -->
      <circle cx="20" cy="18" r="8" fill="#F43F5E"/>
      <text x="16.5" y="22" font-family="'Prompt', sans-serif" font-size="10" font-weight="700" fill="#FFFFFF">⚡</text>
      <text x="34" y="21" font-family="'Prompt', sans-serif" font-size="10.5" font-weight="700" fill="#FFE4E6">สรุปผลการปฏิบัติงาน กฟก.3</text>
      <text x="34" y="32" font-family="'Prompt', sans-serif" font-size="8" fill="#FDA4AF">Quarterly Performance Slides</text>

      <!-- Mini Chart Bars (Performance by Quarter / Individual) -->
      <g transform="translate(20, 50)">
        <!-- Q1 -->
        <rect x="0" y="35" width="28" height="40" rx="4" fill="rgba(244, 63, 94, 0.45)"/>
        <rect x="0" y="20" width="28" height="55" rx="4" fill="url(#roseGrad)"/>
        <text x="6" y="90" font-family="'JetBrains Mono', monospace" font-size="8" fill="#CBD5E1">ไตรมาส 1</text>
        <text x="4" y="14" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="700" fill="#FB7185">92%</text>

        <!-- Q2 -->
        <rect x="58" y="25" width="28" height="50" rx="4" fill="rgba(184, 53, 212, 0.45)"/>
        <rect x="58" y="12" width="28" height="63" rx="4" fill="url(#purpleGlow)"/>
        <text x="64" y="90" font-family="'JetBrains Mono', monospace" font-size="8" fill="#CBD5E1">ไตรมาส 2</text>
        <text x="62" y="7" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="700" fill="#E879F9">96%</text>

        <!-- Q3 -->
        <rect x="116" y="15" width="28" height="60" rx="4" fill="rgba(253, 185, 19, 0.45)"/>
        <rect x="116" y="4" width="28" height="71" rx="4" fill="url(#goldGlow)"/>
        <text x="122" y="90" font-family="'JetBrains Mono', monospace" font-size="8" fill="#CBD5E1">ไตรมาส 3</text>
        <text x="120" y="-1" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="700" fill="#FCD34D">99%</text>

        <!-- Donut / Speedometer Gauge (Right side of slide) -->
        <g transform="translate(185, 38)">
          <circle cx="20" cy="20" r="24" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="6"/>
          <circle cx="20" cy="20" r="24" fill="none" stroke="url(#roseGrad)" stroke-width="6" stroke-dasharray="125 150" stroke-linecap="round"/>
          <text x="9" y="24" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="800" fill="#FFFFFF">98%</text>
          <text x="4" y="39" font-family="'Prompt', sans-serif" font-size="7.5" fill="#FDA4AF">KPI บรรลุ</text>
        </g>
      </g>
    </g>

    <!-- Star Rating & Achievement Footer -->
    <g transform="translate(16, 203)">
      <rect x="0" y="0" width="263" height="68" rx="10" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
      <!-- Stars -->
      <text x="14" y="24" font-family="'Prompt', sans-serif" font-size="14">⭐⭐⭐⭐⭐</text>
      <text x="116" y="22" font-family="'Prompt', sans-serif" font-size="11.5" font-weight="700" fill="#FEF08A">เกณฑ์ประเมินยอดเยี่ยม</text>
      <text x="14" y="42" font-family="'Prompt', sans-serif" font-size="9.5" fill="#CBD5E1">ส่งออกเป็น Presentation สไลด์นำเสนอผู้บริหารทันที</text>
      <text x="14" y="56" font-family="'Prompt', sans-serif" font-size="9" fill="#94A3B8">รองรับบทบาท: 👷‍♂️ Staff ปฏิบัติการ • ⭐ Admin อนุมัติ</text>
    </g>
  </g>
</svg>
