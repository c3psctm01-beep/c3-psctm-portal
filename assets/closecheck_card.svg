<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F0926"/>
      <stop offset="50%" stop-color="#080618"/>
      <stop offset="100%" stop-color="#04020C"/>
    </linearGradient>

    <!-- PEA Purple & Gold Gradients -->
    <linearGradient id="purpleGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8C249E"/>
      <stop offset="100%" stop-color="#B23FD4"/>
    </linearGradient>
    <linearGradient id="goldGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE57F"/>
      <stop offset="100%" stop-color="#FDB913"/>
    </linearGradient>

    <!-- Indigo / SAP Tech Accent Gradients -->
    <linearGradient id="indigoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818CF8"/>
      <stop offset="50%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#4338CA"/>
    </linearGradient>

    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(30, 27, 75, 0.85)"/>
      <stop offset="100%" stop-color="rgba(15, 12, 41, 0.95)"/>
    </linearGradient>

    <linearGradient id="successGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <linearGradient id="dangerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F87171"/>
      <stop offset="100%" stop-color="#DC2626"/>
    </linearGradient>

    <!-- Glow Filters -->
    <filter id="glowIndigo" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="15" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Grid Pattern -->
    <pattern id="gridPattern" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="rgba(99, 102, 241, 0.12)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bgGrad)"/>
  <rect width="800" height="450" fill="url(#gridPattern)"/>

  <!-- Ambient Glowing Orbs -->
  <circle cx="660" cy="160" r="180" fill="#6366F1" opacity="0.2" filter="blur(65px)"/>
  <circle cx="200" cy="220" r="150" fill="#741F84" opacity="0.25" filter="blur(55px)"/>
  <circle cx="450" cy="380" r="140" fill="#FDB913" opacity="0.12" filter="blur(50px)"/>

  <!-- Circuit & Alignment Grid Lines -->
  <g stroke="#6366F1" stroke-width="1" opacity="0.22" stroke-dasharray="5 5">
    <line x1="50" y1="390" x2="750" y2="390"/>
    <line x1="100" y1="60" x2="100" y2="400"/>
    <line x1="700" y1="60" x2="700" y2="400"/>
    <circle cx="400" cy="225" r="180" stroke-width="0.8"/>
  </g>

  <!-- Left: SAP ZPSR018 Checklist Dashboard Board (Card Mockup) -->
  <g transform="translate(70, 75)">
    <!-- Board Base Shadow & Card -->
    <rect x="0" y="0" width="340" height="295" rx="16" fill="url(#cardBg)" stroke="rgba(99, 102, 241, 0.4)" stroke-width="1.5" filter="drop-shadow(0 15px 30px rgba(0,0,0,0.6))"/>
    
    <!-- Header Bar inside board -->
    <rect x="1" y="1" width="338" height="48" rx="15" fill="rgba(99, 102, 241, 0.18)"/>
    <path d="M 1 49 L 339 49" stroke="rgba(99, 102, 241, 0.3)" stroke-width="1"/>
    
    <!-- SAP ZPSR018 Badge -->
    <rect x="16" y="14" width="125" height="22" rx="6" fill="#6366F1" opacity="0.9"/>
    <text x="24" y="29" font-family="'Kanit', 'Prompt', sans-serif" font-size="11" font-weight="700" fill="#FFFFFF" letter-spacing="0.5">SAP ZPSR018 / กส.3</text>

    <!-- Mini Status Tag -->
    <rect x="236" y="14" width="88" height="22" rx="11" fill="rgba(248, 113, 113, 0.2)" stroke="#F87171" stroke-width="1"/>
    <circle cx="248" cy="25" r="3.5" fill="#EF4444"/>
    <text x="256" y="29" font-family="'Prompt', sans-serif" font-size="10.5" font-weight="600" fill="#FCA5A5">รอปิดงาน</text>

    <!-- Checklist Item 1: Template ZPSR018 -->
    <g transform="translate(18, 64)">
      <rect x="0" y="0" width="304" height="38" rx="8" fill="rgba(255,255,255,0.03)" stroke="rgba(52, 211, 153, 0.3)" stroke-width="1"/>
      <circle cx="20" cy="19" r="9" fill="rgba(16, 185, 129, 0.2)"/>
      <path d="M 16 19 L 19 22 L 25 15" fill="none" stroke="#34D399" stroke-width="2" stroke-linecap="round"/>
      <text x="36" y="17" font-family="'Prompt', sans-serif" font-size="11.5" font-weight="600" fill="#E2E8F0">1. รูปแบบเอกสาร SAP ZPSR018</text>
      <text x="36" y="30" font-family="'Prompt', sans-serif" font-size="9.5" fill="#94A3B8">ตรวจสอบความสมบูรณ์ของแบบรายงาน</text>
      <rect x="255" y="10" width="40" height="18" rx="9" fill="#059669"/>
      <text x="264" y="22" font-family="'Prompt', sans-serif" font-size="9" font-weight="700" fill="#FFFFFF">ผ่าน</text>
    </g>

    <!-- Checklist Item 2: Budget Deficit (Warning/Action) -->
    <g transform="translate(18, 110)">
      <rect x="0" y="0" width="304" height="42" rx="8" fill="rgba(239, 68, 68, 0.08)" stroke="rgba(239, 68, 68, 0.35)" stroke-width="1.2"/>
      <circle cx="20" cy="21" r="9" fill="rgba(239, 68, 68, 0.2)"/>
      <path d="M 16 17 L 24 25 M 24 17 L 16 25" fill="none" stroke="#F87171" stroke-width="2" stroke-linecap="round"/>
      <text x="36" y="18" font-family="'Prompt', sans-serif" font-size="11.5" font-weight="600" fill="#FECACA">2. งบประมาณติดลบหน้างาน</text>
      <text x="36" y="32" font-family="'Prompt', sans-serif" font-size="9.5" fill="#F87171">ค่าเบ็ดเตล็ดติดลบ -38,550.56 ฿</text>
      <rect x="240" y="11" width="55" height="20" rx="10" fill="#DC2626"/>
      <text x="248" y="24" font-family="'Prompt', sans-serif" font-size="9" font-weight="700" fill="#FFFFFF">โอนงบ</text>
    </g>

    <!-- Checklist Item 3: Material Return -->
    <g transform="translate(18, 160)">
      <rect x="0" y="0" width="304" height="38" rx="8" fill="rgba(255,255,255,0.03)" stroke="rgba(52, 211, 153, 0.3)" stroke-width="1"/>
      <circle cx="20" cy="19" r="9" fill="rgba(16, 185, 129, 0.2)"/>
      <path d="M 16 19 L 19 22 L 25 15" fill="none" stroke="#34D399" stroke-width="2" stroke-linecap="round"/>
      <text x="36" y="17" font-family="'Prompt', sans-serif" font-size="11.5" font-weight="600" fill="#E2E8F0">3. ตรวจสอบพัสดุค้างส่งคืนคลัง</text>
      <text x="36" y="30" font-family="'Prompt', sans-serif" font-size="9.5" fill="#94A3B8">ไม่มีพัสดุรื้อถอนค้างส่งคืน</text>
      <rect x="255" y="10" width="40" height="18" rx="9" fill="#059669"/>
      <text x="264" y="22" font-family="'Prompt', sans-serif" font-size="9" font-weight="700" fill="#FFFFFF">ผ่าน</text>
    </g>

    <!-- Checklist Item 4: Target Closing Month -->
    <g transform="translate(18, 206)">
      <rect x="0" y="0" width="304" height="38" rx="8" fill="rgba(255,255,255,0.03)" stroke="rgba(99, 102, 241, 0.25)" stroke-width="1"/>
      <circle cx="20" cy="19" r="9" fill="rgba(99, 102, 241, 0.2)"/>
      <circle cx="20" cy="19" r="4" fill="#818CF8"/>
      <text x="36" y="17" font-family="'Prompt', sans-serif" font-size="11.5" font-weight="600" fill="#E2E8F0">4. แผนเดือนที่ต้องปิดงาน</text>
      <text x="36" y="30" font-family="'Prompt', sans-serif" font-size="9.5" fill="#818CF8">กำหนดเป้าหมาย: ก.ย. 2569</text>
      <rect x="238" y="10" width="57" height="18" rx="9" fill="#4338CA"/>
      <text x="246" y="22" font-family="'Prompt', sans-serif" font-size="9" font-weight="700" fill="#E0E7FF">พร้อมปิด</text>
    </g>

    <!-- Bottom summary row -->
    <g transform="translate(18, 252)">
      <text x="4" y="24" font-family="'Prompt', sans-serif" font-size="11" fill="#94A3B8">ความพร้อมปิดงาน:</text>
      <rect x="95" y="14" width="130" height="10" rx="5" fill="rgba(255,255,255,0.08)"/>
      <rect x="95" y="14" width="105" height="10" rx="5" fill="url(#indigoGrad)"/>
      <text x="238" y="24" font-family="'Kanit', sans-serif" font-size="13" font-weight="700" fill="#FDB913">82%</text>
    </g>
  </g>

  <!-- Right: Budget Transfer & Reallocation Visualizer -->
  <g transform="translate(445, 75)">
    <!-- Right Panel Container -->
    <rect x="0" y="0" width="285" height="295" rx="16" fill="url(#cardBg)" stroke="rgba(99, 102, 241, 0.35)" stroke-width="1.5" filter="drop-shadow(0 15px 30px rgba(0,0,0,0.6))"/>
    
    <!-- Header -->
    <rect x="1" y="1" width="283" height="48" rx="15" fill="rgba(253, 185, 19, 0.12)"/>
    <path d="M 1 49 L 284 49" stroke="rgba(253, 185, 19, 0.25)" stroke-width="1"/>
    
    <text x="18" y="30" font-family="'Kanit', sans-serif" font-size="13" font-weight="700" fill="#FDB913" letter-spacing="0.5">
      ⚡ จำลองการโอนงบประมาณ (กส.3)
    </text>

    <!-- Category 1: Surplus (Transfer Out) -->
    <g transform="translate(16, 64)">
      <rect x="0" y="0" width="253" height="52" rx="10" fill="rgba(16, 185, 129, 0.08)" stroke="rgba(52, 211, 153, 0.35)" stroke-width="1"/>
      <text x="14" y="20" font-family="'Prompt', sans-serif" font-size="11" font-weight="600" fill="#E2E8F0">หมวดค่าควบคุมงาน (งบคงเหลือ)</text>
      <text x="14" y="38" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="700" fill="#34D399">+125,480.00 ฿</text>
      <!-- Transfer Out Pill -->
      <rect x="182" y="14" width="58" height="24" rx="12" fill="rgba(52, 211, 153, 0.2)" stroke="#34D399" stroke-width="1"/>
      <text x="190" y="30" font-family="'Prompt', sans-serif" font-size="10" font-weight="700" fill="#34D399">โอนออก</text>
    </g>

    <!-- Animated Transfer Arrow Indicator -->
    <g transform="translate(142, 130)">
      <circle cx="0" cy="0" r="16" fill="#1E1B4B" stroke="#FDB913" stroke-width="1.5" filter="url(#glowIndigo)"/>
      <path d="M 0 -8 L 0 8 M -4 4 L 0 8 L 4 4" fill="none" stroke="#FDB913" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- Category 2: Deficit (Transfer In) -->
    <g transform="translate(16, 156)">
      <rect x="0" y="0" width="253" height="52" rx="10" fill="rgba(239, 68, 68, 0.08)" stroke="rgba(248, 113, 113, 0.35)" stroke-width="1"/>
      <text x="14" y="20" font-family="'Prompt', sans-serif" font-size="11" font-weight="600" fill="#FECACA">หมวดค่าเบ็ดเตล็ด (ยอดเงินติดลบ)</text>
      <text x="14" y="38" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="700" fill="#F87171">-38,550.56 ฿</text>
      <!-- Transfer In Pill -->
      <rect x="182" y="14" width="58" height="24" rx="12" fill="rgba(239, 68, 68, 0.2)" stroke="#F87171" stroke-width="1"/>
      <text x="192" y="30" font-family="'Prompt', sans-serif" font-size="10" font-weight="700" fill="#F87171">รับโอน</text>
    </g>

    <!-- Calculation Outcome Result -->
    <g transform="translate(16, 222)">
      <rect x="0" y="0" width="253" height="58" rx="10" fill="rgba(99, 102, 241, 0.15)" stroke="rgba(99, 102, 241, 0.4)" stroke-width="1"/>
      <text x="12" y="22" font-family="'Prompt', sans-serif" font-size="10.5" fill="#C7D2FE">ผลหลังโอนงบชดเชย:</text>
      <text x="12" y="44" font-family="'Kanit', sans-serif" font-size="14" font-weight="700" fill="#00E676">ยอดสุทธิหน้างาน: 0.00 ฿ (ปิดงานได้)</text>
    </g>
  </g>

  <!-- Bottom Interactive Connection Bar -->
  <g transform="translate(70, 388)">
    <rect x="0" y="0" width="660" height="36" rx="18" fill="rgba(15, 10, 30, 0.75)" stroke="rgba(99, 102, 241, 0.3)" stroke-width="1"/>
    <!-- PEA Logo Emblem Dot -->
    <circle cx="24" cy="18" r="8" fill="#741F84"/>
    <polygon points="24,13 22,18 25,18 23,23 27,17 24,17" fill="#FDB913"/>
    
    <text x="42" y="22" font-family="'Prompt', sans-serif" font-size="11.5" font-weight="500" fill="#E2E8F0">
      ระบบปิดงาน SAP ZPSR018 • นำเข้า PDF อัตโนมัติ • คำนวณโอนงบประมาณ • พิมพ์รายงาน กส.3
    </text>
    <rect x="548" y="7" width="100" height="22" rx="11" fill="url(#indigoGrad)"/>
    <text x="560" y="21" font-family="'Prompt', sans-serif" font-size="10.5" font-weight="700" fill="#FFFFFF">พร้อมใช้งาน ⚡</text>
  </g>
</svg>
