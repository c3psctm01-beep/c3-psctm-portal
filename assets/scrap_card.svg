<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#190628"/>
      <stop offset="60%" stop-color="#0F0318"/>
      <stop offset="100%" stop-color="#08010E"/>
    </linearGradient>
    <linearGradient id="purpleGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8C249E"/>
      <stop offset="100%" stop-color="#B23FD4"/>
    </linearGradient>
    <linearGradient id="goldGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE57F"/>
      <stop offset="100%" stop-color="#FDB913"/>
    </linearGradient>
    <linearGradient id="steelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8E9AA8"/>
      <stop offset="50%" stop-color="#55606E"/>
      <stop offset="100%" stop-color="#333B45"/>
    </linearGradient>
    <linearGradient id="copperGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF9E66"/>
      <stop offset="50%" stop-color="#D9531E"/>
      <stop offset="100%" stop-color="#8C2B05"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <pattern id="gridPattern" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="rgba(140, 36, 158, 0.15)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bgGrad)"/>
  <rect width="800" height="450" fill="url(#gridPattern)"/>

  <!-- High-tech Ambient Orbs -->
  <circle cx="620" cy="220" r="160" fill="#741F84" opacity="0.25" filter="blur(50px)"/>
  <circle cx="240" cy="180" r="130" fill="#FDB913" opacity="0.15" filter="blur(60px)"/>

  <!-- Blueprint & Engineering Grid Lines -->
  <g stroke="#8C249E" stroke-width="1" opacity="0.3" stroke-dasharray="4 4">
    <line x1="80" y1="360" x2="720" y2="360"/>
    <line x1="120" y1="80" x2="120" y2="380"/>
    <circle cx="480" cy="240" r="110"/>
    <circle cx="480" cy="240" r="160"/>
  </g>

  <!-- Left: Digital Weighing Platform & Scale (Isometric 3D) -->
  <g transform="translate(180, 240)">
    <!-- Base Platform -->
    <path d="M 0 40 L 140 -35 L 280 40 L 140 115 Z" fill="#1C182A" stroke="url(#purpleGlow)" stroke-width="2"/>
    <path d="M 0 40 L 0 60 L 140 135 L 140 115 Z" fill="#13101E"/>
    <path d="M 140 115 L 140 135 L 280 60 L 280 40 Z" fill="#0C0914"/>

    <!-- Glowing Scale Ring on Platform -->
    <ellipse cx="140" cy="40" rx="90" ry="45" fill="none" stroke="#FDB913" stroke-width="2" stroke-dasharray="6 6" opacity="0.8"/>
    
    <!-- Heavy Cable Drum / Spool (Aluminum / Copper Conductor) -->
    <g transform="translate(70, -70)">
      <!-- Outer Flange -->
      <ellipse cx="70" cy="45" rx="55" ry="32" fill="url(#steelGrad)" stroke="#A0B0C0" stroke-width="2"/>
      <ellipse cx="70" cy="45" rx="20" ry="12" fill="#20252C"/>
      <!-- Drum Body / Wound Wire -->
      <path d="M 20 40 L 20 85 Q 70 120 120 85 L 120 40 Z" fill="url(#copperGrad)"/>
      <line x1="25" y1="55" x2="115" y2="55" stroke="#FFE082" stroke-width="1" opacity="0.4"/>
      <line x1="22" y1="68" x2="118" y2="68" stroke="#FFE082" stroke-width="1" opacity="0.4"/>
      <line x1="20" y1="80" x2="120" y2="80" stroke="#FFE082" stroke-width="1" opacity="0.4"/>
      <!-- Front Flange -->
      <ellipse cx="70" cy="90" rx="55" ry="32" fill="none" stroke="#A0B0C0" stroke-width="3"/>
      <circle cx="70" cy="90" r="14" fill="#20252C" stroke="#FFE082" stroke-width="2"/>
    </g>

    <!-- Structural Steel Angles / Scrap Lattice Segments -->
    <g transform="translate(180, 10) rotate(-15)">
      <polygon points="0,0 80,-20 86,-10 6,10" fill="url(#steelGrad)" stroke="#C8D4E2" stroke-width="1"/>
      <polygon points="10,-5 70,-20 75,-12 15,3" fill="#3D4550"/>
      <!-- Bolt holes -->
      <circle cx="20" cy="-3" r="2.5" fill="#1C182A" stroke="#C8D4E2"/>
      <circle cx="45" cy="-10" r="2.5" fill="#1C182A" stroke="#C8D4E2"/>
      <circle cx="70" cy="-16" r="2.5" fill="#1C182A" stroke="#C8D4E2"/>
    </g>
    <g transform="translate(20, 20) rotate(25)">
      <polygon points="0,0 90,-25 96,-15 6,10" fill="url(#steelGrad)" stroke="#C8D4E2" stroke-width="1"/>
      <circle cx="25" cy="-5" r="2.5" fill="#1C182A" stroke="#C8D4E2"/>
      <circle cx="55" cy="-13" r="2.5" fill="#1C182A" stroke="#C8D4E2"/>
    </g>
  </g>

  <!-- Right: Futuristic Glassmorphic HUD Calculation Window -->
  <g transform="translate(470, 75)">
    <!-- Glass Panel -->
    <rect width="270" height="295" rx="16" fill="rgba(24, 10, 36, 0.75)" stroke="url(#purpleGlow)" stroke-width="1.5" filter="drop-shadow(0 15px 35px rgba(0,0,0,0.6))"/>
    
    <!-- Top Header Bar -->
    <path d="M 0 16 Q 0 0 16 0 L 254 0 Q 270 0 270 16 L 270 42 L 0 42 Z" fill="rgba(116, 31, 132, 0.35)"/>
    <circle cx="22" cy="21" r="5" fill="#FF5F56"/>
    <circle cx="38" cy="21" r="5" fill="#FFBD2E"/>
    <circle cx="54" cy="21" r="5" fill="#27C93F"/>
    <text x="145" y="26" text-anchor="middle" font-family="'Prompt', sans-serif" font-size="11" font-weight="600" fill="#E0D2EC" letter-spacing="1">PEA SCRAP CALC ENGINE</text>

    <!-- Digital Readout Display -->
    <rect x="20" y="58" width="230" height="65" rx="8" fill="#0C0412" stroke="rgba(253, 185, 19, 0.4)" stroke-width="1"/>
    <text x="32" y="77" font-family="'Prompt', sans-serif" font-size="9" fill="#FDB913" letter-spacing="1.5">NET CALCULATED WEIGHT</text>
    <text x="32" y="108" font-family="'Prompt', monospace" font-size="28" font-weight="700" fill="#FFFFFF">4,850.25</text>
    <text x="195" y="106" font-family="'Prompt', sans-serif" font-size="14" font-weight="600" fill="#FDB913">KG</text>

    <!-- Formula Breakdown Rows -->
    <g transform="translate(20, 140)">
      <!-- Row 1: Steel Lattice -->
      <rect width="230" height="34" rx="6" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.06)"/>
      <circle cx="16" cy="17" r="4" fill="#8C249E"/>
      <text x="28" y="21" font-family="'Prompt', sans-serif" font-size="10.5" fill="#DDD">โครงเหล็กเสาส่ง 115kV</text>
      <text x="215" y="21" text-anchor="end" font-family="'Prompt', sans-serif" font-size="10.5" font-weight="600" fill="#FFF">3,240 kg</text>

      <!-- Row 2: Conductor Cable -->
      <g transform="translate(0, 42)">
        <rect width="230" height="34" rx="6" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.06)"/>
        <circle cx="16" cy="17" r="4" fill="#FDB913"/>
        <text x="28" y="21" font-family="'Prompt', sans-serif" font-size="10.5" fill="#DDD">สายอลูมิเนียม ACSR</text>
        <text x="215" y="21" text-anchor="end" font-family="'Prompt', sans-serif" font-size="10.5" font-weight="600" fill="#FFF">1,610 kg</text>
      </g>

      <!-- Total Estimated Value -->
      <g transform="translate(0, 86)">
        <rect width="230" height="42" rx="8" fill="url(#purpleGlow)" opacity="0.9"/>
        <text x="16" y="26" font-family="'Prompt', sans-serif" font-size="11" font-weight="600" fill="#FFF">มูลค่าประเมินส่งคืนคลัง</text>
        <text x="215" y="26" text-anchor="end" font-family="'Prompt', sans-serif" font-size="14" font-weight="800" fill="#FFE066">฿ 142,850.-</text>
      </g>
    </g>
  </g>

  <!-- High-Tech Badge Floating -->
  <g transform="translate(60, 60)">
    <rect width="180" height="34" rx="17" fill="rgba(253, 185, 19, 0.12)" stroke="#FDB913" stroke-width="1.2"/>
    <circle cx="20" cy="17" r="5" fill="#FDB913" filter="url(#glow)"/>
    <text x="34" y="21" font-family="'Prompt', sans-serif" font-size="11" font-weight="600" fill="#FFE082" letter-spacing="1">ระบบคำนวณคืนพัสดุ</text>
  </g>
</svg>
